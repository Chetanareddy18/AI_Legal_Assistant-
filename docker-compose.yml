services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - VECTOR_BACKEND=${VECTOR_BACKEND:-faiss}
    volumes:
      - ./embeddings:/app/embeddings
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - VECTOR_BACKEND=${VECTOR_BACKEND:-faiss}
    volumes:
      - ./embeddings:/app/embeddings
      - ./results:/app/results
    depends_on:
      - api
