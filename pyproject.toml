[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled by formatter/reviewer judgment
    "BLE001", # broad except is intentional at UI/service boundaries with logging
    "DTZ005", # naive local timestamps are fine for UI history display
]

[tool.pytest.ini_options]
testpaths = ["tests"]
